name: MOL captures
on:
  schedule:
    - cron: "47 18 * * *"   # zilnic 18:47 UTC = 20:47 ora României (iarna); vara 21:47
  workflow_dispatch:
    inputs:
      sedinte:
        description: "Id-uri de ședințe de capturat, separate prin virgulă (gol = regulile din targets.json)"
        type: string
        default: ""
permissions:
  contents: write
jobs:
  captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-capture.txt
      - run: pip install -r requirements-capture.txt
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements-capture.txt') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium
      - run: python capture.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOL_SEDINTE: ${{ inputs.sedinte }}
