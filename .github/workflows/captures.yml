name: MOL captures
on:
  schedule:
    # GitHub rulează cron doar în UTC. Pentru 09:00 și 21:00 ora României tot anul (EET iarna = UTC+2,
    # EEST vara = UTC+3) programăm ambele variante, iar job-ul `gate` păstrează doar rulările care cad
    # exact la 9 sau 21 în Europe/Bucharest.
    - cron: "0 6,18 * * *"   # vara:  06:00/18:00 UTC = 09:00/21:00
    - cron: "0 7,19 * * *"   # iarna: 07:00/19:00 UTC = 09:00/21:00
  workflow_dispatch:
    inputs:
      sedinte:
        description: "Id-uri de ședințe de capturat, separate prin virgulă (gol = regulile din targets.json)"
        type: string
        default: ""
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          h=$(TZ=Europe/Bucharest date +%-H)
          echo "Ora locală (Europe/Bucharest): $h"
          if [ "$h" = "9" ] || [ "$h" = "21" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  captures:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-capture.txt
      - run: pip install -r requirements-capture.txt
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements-capture.txt') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium
      - run: python capture.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOL_SEDINTE: ${{ inputs.sedinte }}
