name: MOL witness
on:
  schedule:
    - cron: "17 */3 * * *"   # la fiecare 3 ore, UTC; o dată la ~24h rularea e `full` (toate ședințele)
  workflow_dispatch:
    inputs:
      full:
        description: "Verifică toate ședințele (max_sedinte), nu doar cele recente"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python witness.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOL_FULL: ${{ inputs.full }}
